CONFIG_SERIAL=y
CONFIG_UART_INTERRUPT_DRIVEN=y
CONFIG_MODEM=y
CONFIG_MODEM_SIM7080=y
CONFIG_NETWORKING=y
CONFIG_NET_NATIVE=n
CONFIG_NET_IPV4=y
CONFIG_NET_IPV6=n
CONFIG_NET_SOCKETS=y
# The driver matches +CADATAIND and +CASTATE URCs to sockets by file
# descriptor, not by connection id, so fds must start at 0 like the ids:
# no POSIX device IO, which reserves 0..2 for stdio.
CONFIG_POSIX_API=n
CONFIG_POSIX_DEVICE_IO=n
CONFIG_CRC=y
CONFIG_MAIN_STACK_SIZE=4096
CONFIG_MODEM_SIMCOM_SIM7080_RX_STACK_SIZE=2048
# One descriptor per modem socket (the driver has five).
CONFIG_ZVFS_OPEN_MAX=5

# The PCF8574's hogs (auxdisplay_pcf8574_27.overlay) apply once the
# expander is up (CONFIG_GPIO_PCF857X_INIT_PRIORITY, the I2C priority, 50)
# and before the display (CONFIG_AUXDISPLAY_INIT_PRIORITY, 85).
CONFIG_I2C=y
CONFIG_GPIO=y
CONFIG_GPIO_HOGS_INIT_PRIORITY=60

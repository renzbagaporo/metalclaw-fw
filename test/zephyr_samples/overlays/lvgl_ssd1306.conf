# The LVGL defaults Zephyr's ssd1306_128x64 shield gives an LVGL build
# (boards/shields/ssd1306/Kconfig.defconfig), for our SSD1306 node
# (ssd1306_3c.overlay), which comes without the shield. Without the 1-bit
# colour depth LVGL takes the panel for a colour one, allocates no
# monochrome conversion buffer, and its mono flush copies 0 - 8 bytes
# (modules/lvgl/lvgl_display_mono.c:81).
CONFIG_LV_Z_VDB_SIZE=64
CONFIG_LV_DPI_DEF=148
CONFIG_LV_Z_COLOR_MONO_HW_INVERSION=y
CONFIG_LV_COLOR_DEPTH_1=y

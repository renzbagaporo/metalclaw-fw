# SPDX-License-Identifier: Apache-2.0 OR MIT
# The rig on the emulator platform: the bench in Renode, started by hand.
# A run tests only the DUT images the change since the last passing
# scheduled run can reach (test/rig/select.py), or every image when there
# is none. A scheduled run is skipped when master has not moved since the
# last one; adding a `schedule` trigger is all a nightly needs.

name: emulator

on:
  workflow_dispatch:
    inputs:
      images:
        description: "Images to run, comma-separated; empty chooses from the diff"
        default: ""
      base:
        description: "Commit to diff against; empty uses the last passing scheduled run"
        default: ""

concurrency:
  group: emulator
  cancel-in-progress: false

permissions:
  contents: read
  actions: read

env:
  # The images whose models the pinned Renode carries. Grows as they land.
  EMULATED_IMAGES: smoke

# actions/cache refuses paths containing "..", so the tool directories live
# in $HOME.

jobs:
  plan:
    runs-on: ubuntu-24.04
    outputs:
      images: ${{ steps.select.outputs.images }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: select
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
          IMAGES: ${{ inputs.images }}
          BASE: ${{ inputs.base }}
        run: |
          set -euo pipefail
          nightlies() {
            gh run list --workflow emulator.yml --branch master --event schedule --status "$1" \
              --limit 1 --json headSha --jq '.[0].headSha // ""'
          }
          if [[ -n "${IMAGES}" ]]; then
            images=$(python3 -c 'import json,sys; print(json.dumps(sys.argv[1].split(",")))' "${IMAGES}")
          else
            if [[ "${EVENT}" == schedule && "$(nightlies completed)" == "${GITHUB_SHA}" ]]; then
              echo "master has not moved since the last nightly"
              echo 'images=[]' >> "$GITHUB_OUTPUT"
              exit 0
            fi
            base="${BASE:-$(nightlies success)}"
            images=$(python3 test/rig/select.py ${base:+--base "$base"} --only "${EMULATED_IMAGES}")
            echo "base: ${base:-none, every image}"
          fi
          echo "images: ${images}"
          echo "images=${images}" >> "$GITHUB_OUTPUT"

  firmware:
    needs: plan
    if: needs.plan.outputs.images != '[]'
    runs-on: ubuntu-24.04
    env:
      IMAGES: ${{ needs.plan.outputs.images }}
    steps:
      - uses: actions/checkout@v4
      - uses: extractions/setup-just@v4
        with:
          just-version: 1.40.0
      - name: Tool directories
        run: |
          {
            echo "METALCLAW_ARM_TOOLCHAIN_DIR=$HOME/.arm-none-eabi"
            echo "METALCLAW_ZEPHYR_WORKSPACE=$HOME/.zephyr-workspace"
            echo "METALCLAW_RENODE_HOME=$HOME/.renode"
            echo "METALCLAW_PROBE_RS_EMULATION_DIR=$HOME/.probe-rs-emulation"
          } >> "$GITHUB_ENV"
      - name: Host packages
        run: |
          sudo apt-get update -o Acquire::Retries=3
          sudo apt-get install -y -o Acquire::Retries=3 build-essential ninja-build cmake python3-venv wget
      - uses: actions/cache@v4
        with:
          path: ~/.arm-none-eabi
          key: arm-none-eabi-${{ hashFiles('justfile') }}
      - uses: actions/cache@v4
        with:
          path: ~/zephyr-sdk-1.0.1
          key: zephyr-sdk-1.0.1-arm
      - uses: actions/cache@v4
        with:
          path: ~/.zephyr-workspace
          key: zephyr-workspace-${{ hashFiles('test/rig/dut/west.yml') }}
      - name: Harness firmware
        run: just setup build
      - name: DUT images
        run: |
          set -euo pipefail
          just setup-zephyr-sdk setup-dut
          for image in $(python3 -c 'import json,os; print(" ".join(json.loads(os.environ["IMAGES"])))'); do
            just build-dut "$([[ "$image" == smoke ]] || echo "$image")"
          done
      - uses: actions/upload-artifact@v4
        with:
          name: firmware
          path: |
            build/rp2/rpi_pi_pico/firmware.uf2
            build/dut/**/zephyr/zephyr.elf
            build/dut/**/zephyr/.config
          # .config is a dotfile, which upload-artifact leaves out by default.
          include-hidden-files: true
          if-no-files-found: error

  probe-rs:
    needs: plan
    if: needs.plan.outputs.images != '[]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: extractions/setup-just@v4
        with:
          just-version: 1.40.0
      - name: Tool directories
        run: |
          {
            echo "METALCLAW_ARM_TOOLCHAIN_DIR=$HOME/.arm-none-eabi"
            echo "METALCLAW_ZEPHYR_WORKSPACE=$HOME/.zephyr-workspace"
            echo "METALCLAW_RENODE_HOME=$HOME/.renode"
            echo "METALCLAW_PROBE_RS_EMULATION_DIR=$HOME/.probe-rs-emulation"
          } >> "$GITHUB_ENV"
      - id: pins
        run: |
          set -euo pipefail
          probe_rs=$(just --evaluate probe_rs_commit)
          echo "probe-rs=${probe_rs}-${{ hashFiles('test/rig/platforms/emulator/*.patch') }}" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v4
        id: probe-rs
        with:
          path: ~/.probe-rs-emulation
          key: probe-rs-emulation-${{ steps.pins.outputs.probe-rs }}
      - name: Build packages
        if: steps.probe-rs.outputs.cache-hit != 'true'
        run: |
          sudo apt-get update -o Acquire::Retries=3
          sudo apt-get install -y -o Acquire::Retries=3 git build-essential pkg-config libudev-dev
      - name: Patched probe-rs
        run: |
          just setup-emulator-probe-rs
          rm -rf "$METALCLAW_PROBE_RS_EMULATION_DIR/src"

  test:
    needs: [plan, firmware, probe-rs]
    runs-on: ubuntu-24.04
    timeout-minutes: 300
    strategy:
      fail-fast: false
      matrix:
        image: ${{ fromJSON(needs.plan.outputs.images) }}
    steps:
      - uses: actions/checkout@v4
      - uses: extractions/setup-just@v4
        with:
          just-version: 1.40.0
      - name: Tool directories
        run: |
          {
            echo "METALCLAW_ARM_TOOLCHAIN_DIR=$HOME/.arm-none-eabi"
            echo "METALCLAW_ZEPHYR_WORKSPACE=$HOME/.zephyr-workspace"
            echo "METALCLAW_RENODE_HOME=$HOME/.renode"
            echo "METALCLAW_PROBE_RS_EMULATION_DIR=$HOME/.probe-rs-emulation"
          } >> "$GITHUB_ENV"
      - id: pins
        run: |
          set -euo pipefail
          probe_rs=$(just --evaluate probe_rs_commit)
          echo "probe-rs=${probe_rs}-${{ hashFiles('test/rig/platforms/emulator/*.patch') }}" >> "$GITHUB_OUTPUT"
      - uses: actions/cache/restore@v4
        with:
          path: ~/.probe-rs-emulation
          key: probe-rs-emulation-${{ steps.pins.outputs.probe-rs }}
          fail-on-cache-miss: true
      - uses: actions/cache/restore@v4
        with:
          path: ~/.arm-none-eabi
          key: arm-none-eabi-${{ hashFiles('justfile') }}
          fail-on-cache-miss: true
      - name: Renode and boot ROMs
        run: just setup-emulator-roms setup-renode
      - uses: actions/download-artifact@v4
        with:
          name: firmware
          path: build
      - name: USB/IP
        run: |
          set -euo pipefail
          sudo apt-get update -o Acquire::Retries=3
          if ! sudo modprobe vhci-hcd 2>/dev/null; then
            sudo apt-get install -y -o Acquire::Retries=3 "linux-modules-extra-$(uname -r)"
            sudo modprobe vhci-hcd
          fi
          sudo apt-get install -y -o Acquire::Retries=3 linux-tools-common linux-tools-generic usbutils python3-venv
          usbip=(/usr/lib/linux-tools-*/usbip)
          sudo ln -sf "${usbip[0]}" /usr/local/bin/usbip
          usbip version
          # The imported harness belongs to root otherwise: its tty for the rig,
          # its USB device for probe-rs.
          echo 'SUBSYSTEMS=="usb", ATTRS{idVendor}=="2fe3", MODE="0666"' \
            | sudo tee /etc/udev/rules.d/70-metalclaw-harness.rules
          sudo udevadm control --reload
      - name: Rig
        env:
          METALCLAW_DUT_DEVICE: ${{ matrix.image }}
        run: just test emulator -v -p no:cacheprovider --junitxml=build/emulator/junit.xml
      - if: always()
        id: name
        run: echo "artifact=rig-${MATRIX_IMAGE//\//-}" >> "$GITHUB_OUTPUT"
        env:
          MATRIX_IMAGE: ${{ matrix.image }}
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.name.outputs.artifact }}
          path: build/emulator/
          if-no-files-found: ignore

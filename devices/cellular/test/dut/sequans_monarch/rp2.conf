CONFIG_SERIAL=y
CONFIG_UART_INTERRUPT_DRIVEN=y
CONFIG_PM_DEVICE=y
CONFIG_MODEM=y
CONFIG_MODEM_CELLULAR=y
CONFIG_MODEM_CELLULAR_APN="internet"
# The DLCI receive rings are the CMUX work buffer size, MTU + 6 by default:
# two full UIH frames on DLCI 1 completing in one 20 ms UART batch overrun
# that and CMUX drops the bytes (subsys/modem/modem_cmux.c).
CONFIG_MODEM_CMUX_WORK_BUFFER_SIZE_EXTRA=512

CONFIG_NETWORKING=y
CONFIG_NET_NATIVE=y
CONFIG_NET_L2_ETHERNET=n
CONFIG_NET_L2_PPP=y
CONFIG_NET_L2_PPP_OPTION_DNS_USE=y
CONFIG_NET_IPV4=y
CONFIG_NET_IPV6=n
CONFIG_NET_TCP=y
CONFIG_NET_UDP=y
CONFIG_NET_SOCKETS=y
# The only resolver server is the one IPCP hands over; a static list would
# take its slot.
CONFIG_DNS_RESOLVER=y
CONFIG_DNS_SERVER_IP_ADDRESSES=n
CONFIG_NET_SOCKETS_DNS_TIMEOUT=10000
CONFIG_NET_SOCKETS_DNS_BACKOFF_INTERVAL=2000
CONFIG_NET_MGMT=y
CONFIG_NET_MGMT_EVENT=y
CONFIG_NET_MGMT_EVENT_INFO=y
CONFIG_NET_CONNECTION_MANAGER=y
CONFIG_NET_PKT_RX_COUNT=16
CONFIG_NET_PKT_TX_COUNT=16
CONFIG_NET_BUF_RX_COUNT=48
CONFIG_NET_BUF_TX_COUNT=48
CONFIG_NET_MAX_CONN=8
CONFIG_NET_MAX_CONTEXTS=8

CONFIG_CRC=y
CONFIG_MAIN_STACK_SIZE=4096
# modem_cellular's scripts and state machine run on the system work queue.
CONFIG_SYSTEM_WORKQUEUE_STACK_SIZE=2048

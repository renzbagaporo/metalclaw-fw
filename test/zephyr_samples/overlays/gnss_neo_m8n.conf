# samples/drivers/gnss with the rig's neo_m8n node on uart1
# (devices/neo_m8n/test/dut/uart1/rp2.overlay): the u-blox M8 driver's UART
# needs, as the rig's neo_m8n/uart1 image has them; the sample's own
# prj.conf keeps the rest.
CONFIG_SERIAL=y
CONFIG_UART_INTERRUPT_DRIVEN=y
CONFIG_UART_USE_RUNTIME_CONFIGURE=y
CONFIG_MAIN_STACK_SIZE=2048
CONFIG_SYSTEM_WORKQUEUE_STACK_SIZE=2048

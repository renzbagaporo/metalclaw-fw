# The sensing sample's MPU-6050 on I2C, polled (no interrupt line), as its
# native_sim.conf has its emulated BMI160s.
CONFIG_I2C=y
CONFIG_SENSOR=y
CONFIG_SENSOR_INFO=y
CONFIG_MPU6050_TRIGGER_NONE=y
# The sensing subsystem logs every step of its start-up, faster than the
# 115200 baud console drains: with the default buffer the logger drops
# them, the sample's own line among them.
CONFIG_LOG_BUFFER_SIZE=16384

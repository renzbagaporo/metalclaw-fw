# The Zephyr workspace the DUT images and the upstream samples
# (test/zephyr_samples) build in. `just setup-dut` initialises it outside the
# repository at METALCLAW_ZEPHYR_WORKSPACE (default ../.zephyr-workspace).
manifest:
  remotes:
    - name: zephyrproject
      url-base: https://github.com/zephyrproject-rtos
  projects:
    - name: zephyr
      remote: zephyrproject
      revision: v4.4.0
      import:
        name-allowlist:
          - cmsis
          - cmsis_6
          - hal_rpi_pico
          - picolibc
          - littlefs
          - loramac-node
          # The samples' display drivers' LVGL samples.
          - lvgl
          # ST's sensor register library (stmemsc), which its drivers such
          # as the LSM6DSO's and LPS22HB's build on.
          - hal_st

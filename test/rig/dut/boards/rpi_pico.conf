# The RP2040 has no entropy source Zephyr drives, and networking needs
# sys_rand_get(); the Pico 2's TRNG covers it there. Test-quality numbers
# are all a DUT fixture needs.
CONFIG_TEST_RANDOM_GENERATOR=y

# The Pico 2 board adds a 16 KiB system heap (getaddrinfo allocates from
# it); match it.
CONFIG_HEAP_MEM_POOL_SIZE=16384
